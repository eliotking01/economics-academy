<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">A trade union in a competitive labour market</title>
  <desc id="d">A labour market with supply S(L)=AC and demand D(L)=MRP crossing at the equilibrium wage W1 and employment Q1. A trade union negotiates the wage W(TU) above the equilibrium; employment demanded falls to Qd while Qs workers want jobs at that wage, so the gap between Qs and Qd is real wage unemployment.</desc>
  <!-- geometry
       intersections: 360,300
       on-curve: 300,240 420,240
  -->
  <!-- guides -->
  <line x1="100" y1="300" x2="360" y2="300" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="300" y1="240" x2="300" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="360" y1="300" x2="360" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="420" y1="240" x2="420" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="40" font-size="26" fill="#333333">Wages</text>
  <text x="708" y="552" font-size="26" fill="#333333" text-anchor="end">Quantity of Labour</text>
  <!-- curves -->
  <line x1="170" y1="490" x2="590" y2="70" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="170" y1="110" x2="550" y2="490" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="100" y1="240" x2="620" y2="240" stroke="#d52349" stroke-width="3"/>
  <!-- labels -->
  <text x="598" y="62" font-size="26" font-weight="700" fill="#1d70b8">S(L)=AC</text>
  <text x="558" y="498" font-size="26" font-weight="700" fill="#1d70b8">D(L)=MRP</text>
  <text x="632" y="248" font-size="26" font-weight="700" fill="#d52349">W(TU)</text>
  <text x="92" y="248" font-size="24" font-weight="700" fill="#d52349" text-anchor="end">W(TU)</text>
  <text x="92" y="308" font-size="24" fill="#333333" text-anchor="end">W1</text>
  <text x="300" y="552" font-size="24" fill="#333333" text-anchor="middle">Qd</text>
  <text x="360" y="552" font-size="24" fill="#333333" text-anchor="middle">Q1</text>
  <text x="420" y="552" font-size="24" fill="#333333" text-anchor="middle">Qs</text>
</svg>
