<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">The short-run shut-down condition</title>
  <desc id="d">A firm diagram with downward-sloping D=AR and MR curves, a rising MC=S curve, and ATC and AVC curves both sitting above the demand curve. At the output Q where MC crosses MR, the price P read off AR lies below average variable cost, so the firm cannot cover its variable costs and shuts down in the short run.</desc>
  <!-- geometry
       intersections: 393.1,479.6 505,300 530,150
       on-curve: 393.1,102.5 393.1,268.8 393.1,304.8
  -->
  <!-- guides -->
  <line x1="100" y1="102.5" x2="393.1" y2="102.5" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="100" y1="268.8" x2="393.1" y2="268.8" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="100" y1="304.8" x2="393.1" y2="304.8" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="393.1" y1="102.5" x2="393.1" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="40" font-size="26" fill="#333333">Cost, revenue</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Quantity</text>
  <!-- curves -->
  <line x1="160" y1="130" x2="620" y2="475" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="160" y1="130" x2="420" y2="520" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 260,485 Q 320,505 380,485 Q 425,470 470,405 Q 488,379 505,300 Q 513,265 530,150 Q 540,82 549,60" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 335,225 Q 415,300 505,300 Q 595,300 655,225" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 360,75 Q 440,150 530,150 Q 620,150 680,75" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- labels -->
  <text x="558" y="72" font-size="26" font-weight="700" fill="#1d70b8">MC=S</text>
  <text x="688" y="80" font-size="26" font-weight="700" fill="#1d70b8">ATC</text>
  <text x="665" y="230" font-size="26" font-weight="700" fill="#1d70b8">AVC</text>
  <text x="632" y="483" font-size="26" font-weight="700" fill="#1d70b8">D=AR</text>
  <text x="428" y="510" font-size="26" font-weight="700" fill="#1d70b8">MR</text>
  <text x="92" y="110" font-size="24" fill="#333333" text-anchor="end">ATC</text>
  <text x="92" y="277" font-size="24" fill="#333333" text-anchor="end">AVC</text>
  <text x="92" y="313" font-size="24" fill="#333333" text-anchor="end">P</text>
  <text x="393" y="552" font-size="24" fill="#333333" text-anchor="middle">Q</text>
</svg>
