<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">Positive externality of production</title>
  <desc id="d">Marginal social cost lies below marginal private cost. The free market produces at Q1 where S equals MPC crosses D, but the social optimum is at Q2 where MSC crosses D. The shaded triangle between D and MSC from Q1 to Q2 is the social welfare loss from under-production.</desc>
  <!-- geometry
       intersections: 300,240 360,300
       on-curve: 300,360
  -->
  <!-- welfare loss triangle -->
  <path d="M300 240 L300 360 L360 300 Z" fill="#767676" fill-opacity="0.25"/>
  <!-- guides -->
  <line x1="100" y1="240" x2="300" y2="240" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="100" y1="300" x2="360" y2="300" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="300" y1="240" x2="300" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="360" y1="300" x2="360" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="50" font-size="26" fill="#333333">Costs, Benefits</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Quantity</text>
  <!-- curves -->
  <line x1="170" y1="110" x2="550" y2="490" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="170" y1="370" x2="470" y2="70" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="170" y1="490" x2="590" y2="70" stroke="#0f7b6c" stroke-width="3.5" stroke-linecap="round"/>
  <!-- annotation -->
  <text x="490" y="350" font-size="24" fill="#333333">Welfare loss</text>
  <line x1="485" y1="345" x2="368" y2="308" stroke="#333333" stroke-width="1.5"/>
  <!-- labels -->
  <text x="478" y="64" font-size="26" font-weight="700" fill="#1d70b8">S=MPC</text>
  <text x="598" y="62" font-size="26" font-weight="700" fill="#0f7b6c">MSC</text>
  <text x="558" y="498" font-size="26" font-weight="700" fill="#1d70b8">D=MPB=MSB</text>
  <text x="92" y="248" font-size="24" fill="#333333" text-anchor="end">P1</text>
  <text x="92" y="308" font-size="24" fill="#333333" text-anchor="end">P2</text>
  <text x="300" y="552" font-size="24" fill="#333333" text-anchor="middle">Q1</text>
  <text x="360" y="552" font-size="24" fill="#333333" text-anchor="middle">Q2</text>
</svg>
