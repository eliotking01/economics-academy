<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">The kinked demand curve in non-collusive oligopoly</title>
  <desc id="d">A demand curve kinked at the current price: elastic above the kink because rivals ignore a price rise, and inelastic below it because rivals match a price cut. The marginal revenue curve is discontinuous at the kink output, and the rising MC=S curve passes through the vertical gap, so the profit-maximising price stays fixed at Pcomp even when marginal cost changes.</desc>
  <!-- geometry
       intersections: 430,370 390,435
       on-curve: 430,250 430,340 430,430 430,423.7
  -->
  <!-- guides -->
  <line x1="100" y1="250" x2="430" y2="250" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="100" y1="423.7" x2="430" y2="423.7" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="430" y1="250" x2="430" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="40" font-size="26" fill="#333333">Cost, revenue</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Quantity</text>
  <!-- curves -->
  <path d="M 160,160 L 430,250 L 620,480" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 160,160 L 430,340 L 430,430 L 467.2,520" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 300,490 Q 350,498 390,435 Q 404,413 430,370 Q 453,331 460,300" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 300,330 Q 340,435 390,435 Q 440,435 480,370" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- annotations -->
  <text x="205" y="150" font-size="24" fill="#333333" transform="rotate(18.43 205 150)">Price elastic demand</text>
  <text x="450" y="258" font-size="24" fill="#333333" transform="rotate(50.44 450 258)">Price inelastic demand</text>
  <!-- labels -->
  <text x="240" y="498" font-size="26" font-weight="700" fill="#1d70b8" text-anchor="end">MC=S</text>
  <text x="292" y="322" font-size="26" font-weight="700" fill="#1d70b8" text-anchor="end">AC</text>
  <text x="632" y="488" font-size="26" font-weight="700" fill="#1d70b8">D=AR</text>
  <text x="473" y="549" font-size="26" font-weight="700" fill="#1d70b8">MR</text>
  <text x="92" y="258" font-size="24" fill="#333333" text-anchor="end">Pcomp</text>
  <text x="92" y="431" font-size="24" fill="#333333" text-anchor="end">C</text>
  <text x="430" y="552" font-size="24" fill="#333333" text-anchor="middle">Q</text>
</svg>
