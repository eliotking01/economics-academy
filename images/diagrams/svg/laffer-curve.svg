<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">The Laffer curve</title>
  <desc id="d">A dome-shaped curve of total tax revenue against the tax rate. Revenue is zero at 0% and 100% tax rates and is maximised at an intermediate rate. At the higher rate t2, revenue R2 is lower than the revenue R1 raised at the lower rate t1, because high rates weaken incentives to work and invest.</desc>
  <!-- geometry
       on-curve: 330,220 460,180 515,248
  -->
  <!-- guides -->
  <line x1="100" y1="220" x2="330" y2="220" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="330" y1="220" x2="330" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="100" y1="248" x2="515" y2="248" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="515" y1="248" x2="515" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="50" font-size="26" fill="#333333">Total tax</text>
  <text x="32" y="78" font-size="26" fill="#333333">revenue (£)</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Tax rate (%)</text>
  <!-- curves -->
  <path d="M 140,460 Q 220,300 330,220 Q 385,180 460,180 Q 492,180 515,248 Q 538,316 585,460" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- labels -->
  <text x="640" y="400" font-size="26" font-weight="700" fill="#1d70b8">Laffer</text>
  <text x="640" y="428" font-size="26" font-weight="700" fill="#1d70b8">curve</text>
  <text x="92" y="228" font-size="24" fill="#333333" text-anchor="end">R1</text>
  <text x="92" y="256" font-size="24" fill="#333333" text-anchor="end">R2</text>
  <text x="330" y="552" font-size="24" fill="#333333" text-anchor="middle">t1</text>
  <text x="515" y="552" font-size="24" fill="#333333" text-anchor="middle">t2</text>
</svg>
