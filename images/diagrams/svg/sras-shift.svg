<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">Shift of the short-run aggregate supply curve</title>
  <desc id="d">A short-run aggregate supply curve SRAS1 shifts right to SRAS2 after a fall in production costs. At the unchanged price level PL, real GDP supplied rises from Y1 to Y2. A shift left from SRAS2 to SRAS1 would show rising production costs.</desc>
  <!-- geometry
       on-curve: 330,300 490,300
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d52349"/>
    </marker>
  </defs>
  <!-- guides -->
  <line x1="100" y1="300" x2="490" y2="300" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="330" y1="300" x2="330" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="490" y1="300" x2="490" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="50" font-size="26" fill="#333333">Price</text>
  <text x="32" y="78" font-size="26" fill="#333333">level</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Real GDP</text>
  <!-- curves -->
  <line x1="170" y1="460" x2="490" y2="140" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="330" y1="460" x2="650" y2="140" stroke="#d52349" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="425" y1="230" x2="535" y2="230" stroke="#d52349" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- labels -->
  <text x="498" y="134" font-size="26" font-weight="700" fill="#1d70b8">SRAS1</text>
  <text x="658" y="134" font-size="26" font-weight="700" fill="#d52349">SRAS2</text>
  <text x="92" y="308" font-size="24" fill="#333333" text-anchor="end">PL</text>
  <text x="330" y="552" font-size="24" fill="#333333" text-anchor="middle">Y1</text>
  <text x="490" y="552" font-size="24" fill="#333333" text-anchor="middle">Y2</text>
</svg>
