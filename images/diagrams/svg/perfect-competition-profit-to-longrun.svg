<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">From supernormal profit to the long run in perfect competition</title>
  <desc id="d">Two panels. In the left market panel, new firms entering shift supply right from S1 to S2, so the price falls from P1 to P2 and quantity rises from Q1 to Q2. In the right firm panel, the new price is the firm's horizontal demand curve D=AR=MR=P2. It just touches the lowest point of the U-shaped AC curve, where the rising MC=S curve also crosses, at output Q2. Price P2 equals average cost C2, so the firm makes normal profit.</desc>
  <!-- geometry
       intersections: 200,330 250,380 562,380
       on-curve: 460,380
  -->
  <!-- Generated by gen_pc_longrun.py. The firm panel is
       efficiency-perfect-competition.svg mapped through x' = 374 + 0.40x,
       y' = 218 + 0.40y: a UNIFORM scale, so the MC/AC crossing at the
       bottom of AC maps exactly to (562,380), the height of the
       market's P2. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d52349"/>
    </marker>
  </defs>
  <!-- the new market price carried across; it stops short of "P2,C2",
       as the ground-truth PNG's does -->
  <line x1="70" y1="380" x2="377" y2="380" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- guides: market panel -->
  <line x1="70" y1="330" x2="200" y2="330" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="200" y1="330" x2="200" y2="460" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="250" y1="380" x2="250" y2="460" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- guides: firm panel -->
  <line x1="562" y1="380" x2="562" y2="460" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes: market panel -->
  <line x1="70" y1="120" x2="70" y2="460" stroke="#333333" stroke-width="2.5"/>
  <line x1="70" y1="460" x2="370" y2="460" stroke="#333333" stroke-width="2.5"/>
  <text x="34" y="84" font-size="26" fill="#333333">Price</text>
  <text x="370" y="524" font-size="26" fill="#333333" text-anchor="end">Quantity</text>
  <!-- axes: firm panel -->
  <line x1="460" y1="120" x2="460" y2="460" stroke="#333333" stroke-width="2.5"/>
  <line x1="460" y1="460" x2="760" y2="460" stroke="#333333" stroke-width="2.5"/>
  <text x="424" y="84" font-size="26" fill="#333333">Cost, revenue</text>
  <text x="760" y="524" font-size="26" fill="#333333" text-anchor="end">Quantity</text>
  <!-- panel titles -->
  <text x="220" y="112" font-size="24" fill="#333333" text-anchor="middle">Market</text>
  <text x="610" y="112" font-size="24" fill="#333333" text-anchor="middle">Firm</text>
  <!-- curves: market panel -->
  <line x1="140" y1="270" x2="310" y2="440" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="110" y1="420" x2="310" y2="220" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="215" y1="415" x2="350" y2="280" stroke="#d52349" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="244" y1="300" x2="318" y2="300" stroke="#d52349" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- curves: firm panel -->
  <line x1="460" y1="380" x2="606" y2="380" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 478,394 Q 502,422.8 526,412 Q 544,406 562,380 Q 569.2,369.6 576,338 Q 579.2,324 586,278" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 494,350 Q 526,380 562,380 Q 598,380 622,350" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- labels: market panel -->
  <text x="318" y="214" font-size="26" font-weight="700" fill="#1d70b8">S1</text>
  <text x="358" y="274" font-size="26" font-weight="700" fill="#d52349">S2</text>
  <text x="318" y="450" font-size="26" font-weight="700" fill="#1d70b8">D</text>
  <text x="62" y="338" font-size="24" fill="#333333" text-anchor="end">P1</text>
  <text x="62" y="388" font-size="24" fill="#333333" text-anchor="end">P2</text>
  <text x="200" y="492" font-size="24" fill="#333333" text-anchor="middle">Q1</text>
  <text x="250" y="492" font-size="24" fill="#333333" text-anchor="middle">Q2</text>
  <!-- labels: firm panel -->
  <text x="616" y="389" font-size="26" font-weight="700" fill="#1d70b8">D=AR=MR=P2</text>
  <text x="592" y="271" font-size="26" font-weight="700" fill="#1d70b8">MC=S</text>
  <text x="630" y="352" font-size="26" font-weight="700" fill="#1d70b8">AC</text>
  <text x="452" y="388" font-size="24" fill="#333333" text-anchor="end">P2,C2</text>
  <text x="562" y="492" font-size="24" fill="#333333" text-anchor="middle">Q2</text>
</svg>
