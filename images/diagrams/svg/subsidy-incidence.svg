<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">Subsidy incidence</title>
  <desc id="d">A per-unit subsidy shifts supply right from S to S plus subsidy. The market price falls from P1 to P2 — the consumer gain — while producers receive P3, the price plus the subsidy, so P1 to P3 is the producer gain. Output rises from Q1 to Q2.</desc>
  <!-- geometry
       intersections: 360,300 420,360
       on-curve: 420,240
  -->
  <!-- shaded gains -->
  <rect x="100" y="240" width="320" height="60" fill="#0f7b6c" fill-opacity="0.15"/>
  <rect x="100" y="300" width="320" height="60" fill="#1d70b8" fill-opacity="0.15"/>
  <!-- guides -->
  <line x1="100" y1="240" x2="420" y2="240" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="100" y1="300" x2="420" y2="300" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="100" y1="360" x2="420" y2="360" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="360" y1="300" x2="360" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="420" y1="240" x2="420" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="50" font-size="26" fill="#333333">Price</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Quantity</text>
  <!-- curves -->
  <line x1="170" y1="110" x2="550" y2="490" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="170" y1="490" x2="590" y2="70" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="260" y1="520" x2="650" y2="130" stroke="#d52349" stroke-width="3.5" stroke-linecap="round"/>
  <!-- labels -->
  <text x="598" y="62" font-size="26" font-weight="700" fill="#1d70b8">S</text>
  <text x="658" y="124" font-size="26" font-weight="700" fill="#d52349">S+Subsidy</text>
  <text x="558" y="498" font-size="26" font-weight="700" fill="#1d70b8">D</text>
  <text x="92" y="248" font-size="24" fill="#333333" text-anchor="end">P3</text>
  <text x="92" y="308" font-size="24" fill="#333333" text-anchor="end">P1</text>
  <text x="92" y="368" font-size="24" fill="#333333" text-anchor="end">P2</text>
  <text x="360" y="552" font-size="24" fill="#333333" text-anchor="middle">Q1</text>
  <text x="420" y="552" font-size="24" fill="#333333" text-anchor="middle">Q2</text>
  <text x="180" y="276" font-size="22" fill="#333333" text-anchor="middle">Producer gain</text>
  <text x="180" y="336" font-size="22" fill="#333333" text-anchor="middle">Consumer gain</text>
</svg>
