<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">An increase in aggregate demand in the classical model</title>
  <desc id="d">Aggregate demand shifts right from AD1 to AD2 against a vertical classical LRAS1 curve. The price level rises from PL1 to PL2 but real output stays at full-employment output Yfe.</desc>
  <!-- geometry
       intersections: 430,360 430,250
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d52349"/>
    </marker>
  </defs>
  <!-- guides -->
  <line x1="100" y1="360" x2="430" y2="360" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="100" y1="250" x2="430" y2="250" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="50" font-size="26" fill="#333333">Price</text>
  <text x="32" y="78" font-size="26" fill="#333333">level</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Real GDP</text>
  <!-- curves -->
  <line x1="430" y1="90" x2="430" y2="520" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="200" y1="130" x2="480" y2="410" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="270" y1="90" x2="560" y2="380" stroke="#d52349" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="245" y1="150" x2="305" y2="150" stroke="#d52349" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- labels -->
  <text x="430" y="74" font-size="26" font-weight="700" fill="#1d70b8" text-anchor="middle">LRAS1</text>
  <text x="488" y="418" font-size="26" font-weight="700" fill="#1d70b8">AD1</text>
  <text x="568" y="388" font-size="26" font-weight="700" fill="#d52349">AD2</text>
  <text x="92" y="368" font-size="24" fill="#333333" text-anchor="end">PL1</text>
  <text x="92" y="258" font-size="24" fill="#333333" text-anchor="end">PL2</text>
  <text x="430" y="552" font-size="24" fill="#333333" text-anchor="middle">Yfe</text>
</svg>
