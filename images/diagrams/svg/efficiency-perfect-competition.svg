<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">Efficiency in perfect competition in long-run equilibrium</title>
  <desc id="d">A perfectly competitive firm in long-run equilibrium: the horizontal demand curve D=AR=MR=P is tangent to the minimum of the U-shaped AC curve, and the rising MC=S curve passes through the same point. Price equals marginal cost, giving allocative efficiency, and output is at minimum average cost, giving productive efficiency, at the same output Q.</desc>
  <!-- geometry
       intersections: 470,405
       on-curve: 463,405 477,405
  -->
  <!-- guides -->
  <line x1="470" y1="405" x2="470" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="40" font-size="26" fill="#333333">Cost, revenue</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Quantity</text>
  <!-- curves -->
  <line x1="100" y1="405" x2="620" y2="405" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 260,485 Q 320,505 380,485 Q 425,470 470,405 Q 488,379 505,300 Q 513,265 530,150" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 300,330 Q 380,405 470,405 Q 560,405 620,330" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="463" cy="405" r="7" fill="#0f7b6c"/>
  <circle cx="477" cy="405" r="7" fill="#d52349"/>
  <!-- in-diagram key. Two lines per entry: "Productive efficiency: MC=AC" measures
       321px at 24px and would run 112px past the 800px canvas edge on one line. -->
  <circle cx="540" cy="183" r="7" fill="#0f7b6c"/>
  <text x="554" y="190" font-size="24" fill="#333333">Productive efficiency</text>
  <text x="554" y="220" font-size="24" fill="#333333">MC=AC</text>
  <circle cx="540" cy="247" r="7" fill="#d52349"/>
  <text x="554" y="254" font-size="24" fill="#333333">Allocative efficiency</text>
  <text x="554" y="284" font-size="24" fill="#333333">AR=MC</text>
  <!-- labels -->
  <text x="542" y="144" font-size="26" font-weight="700" fill="#1d70b8">MC=S</text>
  <text x="630" y="324" font-size="26" font-weight="700" fill="#1d70b8">AC</text>
  <text x="632" y="413" font-size="26" font-weight="700" fill="#1d70b8">D=AR=MR=P</text>
  <text x="92" y="413" font-size="24" fill="#333333" text-anchor="end">P,C</text>
  <text x="470" y="552" font-size="24" fill="#333333" text-anchor="middle">Q</text>
</svg>
