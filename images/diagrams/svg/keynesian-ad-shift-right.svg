<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">An increase in aggregate demand in the Keynesian model</title>
  <desc id="d">Aggregate demand shifts right from AD1 to AD2 along an L-shaped Keynesian LRAS1 curve. With spare capacity, output rises strongly from Y1 to Y2 while the price level rises only modestly from PL1 to PL2, still below full-capacity output Yfe.</desc>
  <!-- geometry
       intersections: 395,395 475,300
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d52349"/>
    </marker>
  </defs>
  <!-- guides -->
  <line x1="100" y1="395" x2="395" y2="395" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="395" y1="395" x2="395" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="100" y1="300" x2="475" y2="300" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="475" y1="300" x2="475" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="520" y1="120" x2="520" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="50" font-size="26" fill="#333333">Price</text>
  <text x="32" y="78" font-size="26" fill="#333333">level</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Real GDP</text>
  <!-- curves -->
  <path d="M 100,430 L 250,430 Q 340,430 395,395 Q 450,360 475,300 Q 500,240 513,195 Q 520,163 520,120" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="165" y1="165" x2="510" y2="510" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="245" y1="70" x2="505" y2="330" stroke="#d52349" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="195" y1="170" x2="320" y2="170" stroke="#d52349" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- labels -->
  <text x="532" y="112" font-size="26" font-weight="700" fill="#1d70b8">LRAS1</text>
  <text x="531" y="510" font-size="26" font-weight="700" fill="#1d70b8">AD1</text>
  <text x="531" y="342" font-size="26" font-weight="700" fill="#d52349">AD2</text>
  <text x="92" y="403" font-size="24" fill="#333333" text-anchor="end">PL1</text>
  <text x="92" y="308" font-size="24" fill="#333333" text-anchor="end">PL2</text>
  <text x="395" y="552" font-size="24" fill="#333333" text-anchor="middle">Y1</text>
  <text x="475" y="552" font-size="24" fill="#333333" text-anchor="middle">Y2</text>
  <text x="520" y="552" font-size="24" fill="#333333" text-anchor="middle">Yfe</text>
</svg>
