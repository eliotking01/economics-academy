<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">Economies and diseconomies of scale on the LRAC curve</title>
  <desc id="d">A U-shaped long-run average cost curve. Average costs fall over the economies-of-scale section, reach their minimum at the minimum efficient scale, and rise over the diseconomies-of-scale section.</desc>
  <!-- geometry
       on-curve: 400,460
  -->
  <defs>
    <marker id="arrowg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#333333"/>
    </marker>
  </defs>
  <!-- guides -->
  <line x1="400" y1="460" x2="400" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="50" font-size="26" fill="#333333">Costs</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Quantity</text>
  <!-- curves -->
  <path d="M 140,200 Q 240,460 400,460 Q 560,460 660,200" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- annotations -->
  <line x1="300" y1="320" x2="350" y2="400" stroke="#333333" stroke-width="2.5" marker-end="url(#arrowg)"/>
  <text x="250" y="270" font-size="24" fill="#333333">Economies</text>
  <text x="250" y="298" font-size="24" fill="#333333">of scale</text>
  <line x1="530" y1="390" x2="590" y2="310" stroke="#333333" stroke-width="2.5" marker-end="url(#arrowg)"/>
  <text x="500" y="270" font-size="24" fill="#333333">Diseconomies</text>
  <text x="500" y="298" font-size="24" fill="#333333">of scale</text>
  <!-- labels -->
  <text x="640" y="160" font-size="26" font-weight="700" fill="#1d70b8">LRAC</text>
  <text x="400" y="552" font-size="24" fill="#333333" text-anchor="middle">MES</text>
</svg>
