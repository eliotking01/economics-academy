<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">The Kuznets curve</title>
  <desc id="d">A Kuznets curve diagram plotting income inequality against economic development measured by real GDP per capita. The curve is an inverted U: inequality rises through the early stages of development, peaks at the dashed dividing line between developing and developed economies, and then falls as development continues.</desc>
  <!-- geometry
       intersections: 395,177.5
       on-curve: 170,440 620,440
  -->
  <!-- guides -->
  <line x1="395" y1="177.5" x2="395" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="690" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="70" y="40" font-size="26" fill="#333333">Income inequality</text>
  <text x="395" y="565" font-size="26" fill="#333333" text-anchor="middle">Economic Development (Real GDP/capita)</text>
  <!-- curves -->
  <path d="M 170,440 C 250,90 540,90 620,440" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- labels -->
  <text x="640" y="420" font-size="26" font-weight="700" fill="#1d70b8">Kuznets</text>
  <text x="640" y="448" font-size="26" font-weight="700" fill="#1d70b8">curve</text>
  <text x="380" y="495" font-size="24" fill="#333333" text-anchor="end">Developing economies</text>
  <text x="410" y="495" font-size="24" fill="#333333">Developed economies</text>
</svg>
