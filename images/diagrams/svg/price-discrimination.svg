<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">Third-degree price discrimination across two sub-markets</title>
  <desc id="d">Two panels sharing one horizontal AC=MC cost line. In the left panel the sub-market with price inelastic demand has a steep demand curve, and the firm sells where MR meets MC and charges a high price. In the right panel the sub-market with price elastic demand has a flatter demand curve and receives a lower price. The shaded rectangles between price and cost are the profits from each group, which together exceed the profit from charging one price to everyone.</desc>
  <!-- geometry
       intersections: 185.7,380 613.3,380
       on-curve: 185.7,265 613.3,280
  -->
  <!-- shaded profits -->
  <rect x="70" y="265" width="115.7" height="115" fill="#0f7b6c" fill-opacity="0.15"/>
  <rect x="460" y="280" width="153.3" height="100" fill="#0f7b6c" fill-opacity="0.15"/>
  <!-- guides -->
  <line x1="70" y1="265" x2="185.7" y2="265" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="185.7" y1="265" x2="185.7" y2="460" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="460" y1="280" x2="613.3" y2="280" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="613.3" y1="280" x2="613.3" y2="460" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes: inelastic panel -->
  <line x1="70" y1="120" x2="70" y2="460" stroke="#333333" stroke-width="2.5"/>
  <line x1="70" y1="460" x2="370" y2="460" stroke="#333333" stroke-width="2.5"/>
  <text x="34" y="84" font-size="26" fill="#333333">Cost, revenue</text>
  <text x="370" y="492" font-size="26" fill="#333333" text-anchor="end">Quantity</text>
  <!-- axes: elastic panel -->
  <line x1="460" y1="120" x2="460" y2="460" stroke="#333333" stroke-width="2.5"/>
  <line x1="460" y1="460" x2="760" y2="460" stroke="#333333" stroke-width="2.5"/>
  <text x="760" y="492" font-size="26" fill="#333333" text-anchor="end">Quantity</text>
  <!-- panel titles -->
  <text x="220" y="112" font-size="24" fill="#333333" text-anchor="middle">Inelastic sub-market</text>
  <text x="610" y="112" font-size="24" fill="#333333" text-anchor="middle">Elastic sub-market</text>
  <!-- curves -->
  <line x1="70" y1="380" x2="760" y2="380" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="120" y1="150" x2="280" y2="430" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="120" y1="150" x2="208.6" y2="460" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="480" y1="180" x2="700" y2="345" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="480" y1="180" x2="666.7" y2="460" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="185.7" cy="380" r="7" fill="#d52349"/>
  <circle cx="613.3" cy="380" r="7" fill="#d52349"/>
  <!-- labels -->
  <text x="760" y="406" font-size="26" font-weight="700" fill="#1d70b8" text-anchor="end">AC=MC</text>
  <text x="288" y="438" font-size="26" font-weight="700" fill="#1d70b8">D=AR</text>
  <text x="214" y="448" font-size="26" font-weight="700" fill="#1d70b8">MR</text>
  <text x="708" y="353" font-size="26" font-weight="700" fill="#1d70b8">D=AR</text>
  <text x="674" y="448" font-size="26" font-weight="700" fill="#1d70b8">MR</text>
  <text x="62" y="273" font-size="24" fill="#333333" text-anchor="end">P</text>
  <text x="62" y="388" font-size="24" fill="#333333" text-anchor="end">C</text>
  <text x="185.7" y="492" font-size="24" fill="#333333" text-anchor="middle">Q</text>
  <text x="452" y="288" font-size="24" fill="#333333" text-anchor="end">P</text>
  <text x="613.3" y="492" font-size="24" fill="#333333" text-anchor="middle">Q</text>
</svg>
