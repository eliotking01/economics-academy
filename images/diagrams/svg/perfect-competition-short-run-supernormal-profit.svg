<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">Short-run supernormal profit in perfect competition</title>
  <desc id="d">Two panels. In the left market panel, supply and demand cross to set the market price P1 at output Q1. In the right firm panel, that same price is the firm's horizontal demand curve D=AR=MR=P1, carried across by the dashed line. The firm produces at the output Q1 where the rising MC=S curve crosses the price line; average cost C1 read off the U-shaped AC curve lies below the price, and the rectangle between P1 and C1 up to Q1 is shaded as supernormal profit.</desc>
  <!-- geometry
       intersections: 220,350 662.5,350
       on-curve: 662.5,401
  -->
  <!-- The firm panel is the previous single-panel drawing mapped through
       x' = 460 + (x-100)/2, y' = 200 + y/2. The scale is UNIFORM, so every 45
       degree slope stays 45 degrees and the MC/AC tangency at the old (505,300)
       and (505,402) transforms exactly rather than being redrawn by eye. -->
  <!-- shaded supernormal profit -->
  <rect x="460" y="350" width="202.5" height="51" fill="#0f7b6c" fill-opacity="0.15"/>
  <!-- the market price carried across to the firm -->
  <line x1="70" y1="350" x2="460" y2="350" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- guides: market panel -->
  <line x1="220" y1="350" x2="220" y2="460" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- guides: firm panel -->
  <line x1="460" y1="401" x2="662.5" y2="401" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="662.5" y1="350" x2="662.5" y2="460" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes: market panel -->
  <line x1="70" y1="120" x2="70" y2="460" stroke="#333333" stroke-width="2.5"/>
  <line x1="70" y1="460" x2="370" y2="460" stroke="#333333" stroke-width="2.5"/>
  <text x="34" y="84" font-size="26" fill="#333333">Price</text>
  <text x="370" y="524" font-size="26" fill="#333333" text-anchor="end">Quantity</text>
  <!-- axes: firm panel -->
  <line x1="460" y1="120" x2="460" y2="460" stroke="#333333" stroke-width="2.5"/>
  <line x1="460" y1="460" x2="760" y2="460" stroke="#333333" stroke-width="2.5"/>
  <text x="424" y="84" font-size="26" fill="#333333">Cost, revenue</text>
  <text x="760" y="524" font-size="26" fill="#333333" text-anchor="end">Quantity</text>
  <!-- panel titles -->
  <text x="220" y="112" font-size="24" fill="#333333" text-anchor="middle">Market</text>
  <text x="610" y="112" font-size="24" fill="#333333" text-anchor="middle">Firm</text>
  <!-- curves: market panel -->
  <line x1="140" y1="430" x2="330" y2="240" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="140" y1="270" x2="310" y2="440" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- curves: firm panel -->
  <line x1="460" y1="350" x2="710" y2="350" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 540,420 Q 570,456 600,442.5 Q 622.5,435 645,402.5 Q 654,389.5 662.5,350 Q 666.5,332.5 675,275" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 560,365 Q 600,402.5 645,402.5 Q 690,402.5 720,365" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="662.5" cy="350" r="7" fill="#d52349"/>
  <!-- labels: market panel -->
  <text x="338" y="234" font-size="26" font-weight="700" fill="#1d70b8">S</text>
  <text x="318" y="450" font-size="26" font-weight="700" fill="#1d70b8">D</text>
  <text x="62" y="358" font-size="24" fill="#333333" text-anchor="end">P1</text>
  <text x="220" y="492" font-size="24" fill="#333333" text-anchor="middle">Q1</text>
  <!-- labels: firm panel -->
  <text x="466" y="330" font-size="26" font-weight="700" fill="#1d70b8">D=AR=MR=P1</text>
  <text x="681" y="268" font-size="26" font-weight="700" fill="#1d70b8">MC=S</text>
  <text x="726" y="372" font-size="26" font-weight="700" fill="#1d70b8">AC</text>
  <text x="452" y="358" font-size="24" fill="#333333" text-anchor="end">P1</text>
  <text x="452" y="409" font-size="24" fill="#333333" text-anchor="end">C1</text>
  <text x="662.5" y="492" font-size="24" fill="#333333" text-anchor="middle">Q1</text>
</svg>
