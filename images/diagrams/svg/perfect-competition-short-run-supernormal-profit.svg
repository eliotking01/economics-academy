<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">Short-run supernormal profit in perfect competition</title>
  <desc id="d">A perfectly competitive firm faces a horizontal demand curve D=AR=MR at the market price P1. It produces at the output Q1 where the rising MC=S curve crosses the price line; average cost C1 read off the U-shaped AC curve lies below the price, and the rectangle between P1 and C1 up to Q1 is shaded as supernormal profit.</desc>
  <!-- geometry
       intersections: 505,300
       on-curve: 505,402
  -->
  <!-- shaded supernormal profit -->
  <rect x="100" y="300" width="405" height="102" fill="#0f7b6c" fill-opacity="0.15"/>
  <!-- guides -->
  <line x1="100" y1="402" x2="505" y2="402" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="505" y1="300" x2="505" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="40" font-size="26" fill="#333333">Cost, revenue</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Quantity</text>
  <!-- curves -->
  <line x1="100" y1="300" x2="600" y2="300" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 260,485 Q 320,505 380,485 Q 425,470 470,405 Q 488,379 505,300 Q 513,265 530,150" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 300,330 Q 380,405 470,405 Q 560,405 620,330" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="505" cy="300" r="7" fill="#d52349"/>
  <!-- labels -->
  <text x="542" y="144" font-size="26" font-weight="700" fill="#1d70b8">MC=S</text>
  <text x="630" y="345" font-size="26" font-weight="700" fill="#1d70b8">AC</text>
  <text x="612" y="308" font-size="26" font-weight="700" fill="#1d70b8">D=AR=MR=P1</text>
  <text x="92" y="308" font-size="24" fill="#333333" text-anchor="end">P1</text>
  <text x="92" y="410" font-size="24" fill="#333333" text-anchor="end">C1</text>
  <text x="505" y="552" font-size="24" fill="#333333" text-anchor="middle">Q1</text>
</svg>
