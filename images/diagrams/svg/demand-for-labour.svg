<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">The demand curve for labour</title>
  <desc id="d">A downward-sloping labour demand curve labelled D(L)=MRP on axes of wages against quantity of labour. At the higher wage W1 the firm employs Q1 workers; at the lower wage W2 it employs the larger quantity Q2, a movement along the curve.</desc>
  <!-- geometry
       on-curve: 330,260 460,390
  -->
  <!-- guides -->
  <line x1="100" y1="260" x2="330" y2="260" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="330" y1="260" x2="330" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="100" y1="390" x2="460" y2="390" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="460" y1="390" x2="460" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="40" font-size="26" fill="#333333">Wages</text>
  <text x="708" y="552" font-size="26" fill="#333333" text-anchor="end">Quantity of Labour</text>
  <!-- curves -->
  <line x1="170" y1="100" x2="570" y2="500" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- labels -->
  <text x="582" y="506" font-size="26" font-weight="700" fill="#1d70b8">D(L)=MRP</text>
  <text x="92" y="268" font-size="24" fill="#333333" text-anchor="end">W1</text>
  <text x="92" y="398" font-size="24" fill="#333333" text-anchor="end">W2</text>
  <text x="330" y="552" font-size="24" fill="#333333" text-anchor="middle">Q1</text>
  <text x="460" y="552" font-size="24" fill="#333333" text-anchor="middle">Q2</text>
</svg>
