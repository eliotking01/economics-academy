<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">A positive output gap in the classical model</title>
  <desc id="d">Aggregate demand and short-run aggregate supply intersect at output Y1 and price level PL1, to the right of the vertical LRAS curve at full-employment output Yfe. Actual output temporarily exceeds potential output, a positive output gap.</desc>
  <!-- geometry
       intersections: 330,300 250,380 250,220
  -->
  <!-- guides -->
  <line x1="100" y1="300" x2="330" y2="300" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="330" y1="300" x2="330" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="50" font-size="26" fill="#333333">Price</text>
  <text x="32" y="78" font-size="26" fill="#333333">level</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Real GDP</text>
  <!-- curves -->
  <line x1="250" y1="90" x2="250" y2="520" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="170" y1="460" x2="530" y2="100" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="170" y1="140" x2="490" y2="460" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- labels -->
  <text x="250" y="74" font-size="26" font-weight="700" fill="#1d70b8" text-anchor="middle">LRAS</text>
  <text x="538" y="94" font-size="26" font-weight="700" fill="#1d70b8">SRAS</text>
  <text x="498" y="470" font-size="26" font-weight="700" fill="#1d70b8">AD</text>
  <text x="92" y="308" font-size="24" fill="#333333" text-anchor="end">PL1</text>
  <text x="250" y="552" font-size="24" fill="#333333" text-anchor="middle">Yfe</text>
  <text x="330" y="552" font-size="24" fill="#333333" text-anchor="middle">Y1</text>
</svg>
