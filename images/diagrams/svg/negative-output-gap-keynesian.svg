<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">A negative output gap in the Keynesian model</title>
  <desc id="d">Aggregate demand crosses an L-shaped Keynesian LRAS curve at output Y1 and price level PL1, below full-capacity output Yfe. The economy is in equilibrium with spare capacity, a negative output gap.</desc>
  <!-- geometry
       intersections: 395,395
  -->
  <!-- guides -->
  <line x1="100" y1="395" x2="395" y2="395" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="395" y1="395" x2="395" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="520" y1="120" x2="520" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="50" font-size="26" fill="#333333">Price</text>
  <text x="32" y="78" font-size="26" fill="#333333">level</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Real GDP</text>
  <!-- curves -->
  <path d="M 100,430 L 250,430 Q 340,430 395,395 Q 450,360 475,300 Q 500,240 513,195 Q 520,163 520,120" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="165" y1="165" x2="510" y2="510" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- labels -->
  <text x="532" y="112" font-size="26" font-weight="700" fill="#1d70b8">LRAS</text>
  <text x="531" y="510" font-size="26" font-weight="700" fill="#1d70b8">AD</text>
  <text x="92" y="403" font-size="24" fill="#333333" text-anchor="end">PL1</text>
  <text x="395" y="552" font-size="24" fill="#333333" text-anchor="middle">Y1</text>
  <text x="520" y="552" font-size="24" fill="#333333" text-anchor="middle">Yfe</text>
</svg>
