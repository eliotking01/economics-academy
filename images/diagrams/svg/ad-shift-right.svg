<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">Demand-pull inflation on an AD/AS diagram</title>
  <desc id="d">Aggregate demand shifts right from AD1 to AD2 along an upward-sloping SRAS curve. The equilibrium price level rises from PL1 to PL2 and real GDP rises from Y1 to Y2, illustrating demand-pull inflation.</desc>
  <!-- geometry
       intersections: 330,300 410,220
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d52349"/>
    </marker>
  </defs>
  <!-- guides -->
  <line x1="100" y1="300" x2="330" y2="300" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="330" y1="300" x2="330" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="100" y1="220" x2="410" y2="220" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="410" y1="220" x2="410" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="50" font-size="26" fill="#333333">Price</text>
  <text x="32" y="78" font-size="26" fill="#333333">level</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Real GDP</text>
  <!-- curves -->
  <line x1="170" y1="460" x2="530" y2="100" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="170" y1="140" x2="490" y2="460" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="330" y1="140" x2="650" y2="460" stroke="#d52349" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="225" y1="170" x2="335" y2="170" stroke="#d52349" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- labels -->
  <text x="538" y="94" font-size="26" font-weight="700" fill="#1d70b8">SRAS</text>
  <text x="498" y="470" font-size="26" font-weight="700" fill="#1d70b8">AD1</text>
  <text x="658" y="470" font-size="26" font-weight="700" fill="#d52349">AD2</text>
  <text x="92" y="228" font-size="24" fill="#333333" text-anchor="end">PL2</text>
  <text x="92" y="308" font-size="24" fill="#333333" text-anchor="end">PL1</text>
  <text x="330" y="552" font-size="24" fill="#333333" text-anchor="middle">Y1</text>
  <text x="410" y="552" font-size="24" fill="#333333" text-anchor="middle">Y2</text>
</svg>
