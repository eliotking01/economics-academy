<svg viewBox="0 0 800 960" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">The five price elasticity of demand ranges</title>
  <desc id="d">Five demand diagrams with P on the vertical axis and Q on the horizontal axis, in order from perfectly price inelastic to perfectly price elastic. Perfectly price inelastic: a vertical demand curve D at Q1, so a fall in price from P1 to P2 leaves quantity unchanged. Relatively price inelastic: a steep D, where the fall from P1 to P2 raises quantity only a little, from Q1 to Q2. Unitary price elastic: a curved D bowed in towards the origin. Relatively price elastic: a shallow D, where a small fall from P1 to P2 raises quantity a lot, from Q1 to Q2. Perfectly price elastic: a horizontal D at P1, with quantity anywhere from Q1 to Q2 at that price.</desc>
  <!-- geometry
       on-curve: 190,140 190,200 560,120 608,240 130,490 235,550 530,470 650,510 340,810 430,810
       Generated from computed geometry. Straight demand curves are not 45 degrees on
       purpose: relatively inelastic has screen slope 3, relatively elastic 1/3. The
       unitary curve is a polyline of exact points on P x Q = 7000 (local axis units),
       a rectangular hyperbola, so PED = -1 all along it.
  -->
  <!-- Perfectly Price Inelastic -->
  <text x="195" y="30" font-size="24" fill="#333333" text-anchor="middle">Perfectly Price Inelastic</text>
  <line x1="60" y1="75" x2="60" y2="270" stroke="#333333" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="60" y1="270" x2="330" y2="270" stroke="#333333" stroke-width="2.5" stroke-linecap="square"/>
  <text x="48" y="88" font-size="26" fill="#333333" text-anchor="end">P</text>
  <text x="342" y="279" font-size="26" fill="#333333">Q</text>
  <line x1="60" y1="140" x2="190" y2="140" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="60" y1="200" x2="190" y2="200" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="190" y1="85" x2="190" y2="270" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <text x="200" y="100" font-size="26" font-weight="700" fill="#1d70b8">D</text>
  <text x="52" y="148" font-size="24" fill="#333333" text-anchor="end">P1</text>
  <text x="52" y="208" font-size="24" fill="#333333" text-anchor="end">P2</text>
  <text x="190" y="298" font-size="24" fill="#333333" text-anchor="middle">Q1</text>
  <!-- Relatively Price Inelastic -->
  <text x="595" y="30" font-size="24" fill="#333333" text-anchor="middle">Relatively Price Inelastic</text>
  <line x1="460" y1="75" x2="460" y2="270" stroke="#333333" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="460" y1="270" x2="730" y2="270" stroke="#333333" stroke-width="2.5" stroke-linecap="square"/>
  <text x="448" y="88" font-size="26" fill="#333333" text-anchor="end">P</text>
  <text x="742" y="279" font-size="26" fill="#333333">Q</text>
  <line x1="460" y1="120" x2="560" y2="120" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="560" y1="120" x2="560" y2="270" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="460" y1="240" x2="608" y2="240" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="608" y1="240" x2="608" y2="270" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="546" y1="85" x2="612" y2="250" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <text x="620" y="258" font-size="26" font-weight="700" fill="#1d70b8">D</text>
  <text x="452" y="128" font-size="24" fill="#333333" text-anchor="end">P1</text>
  <text x="452" y="248" font-size="24" fill="#333333" text-anchor="end">P2</text>
  <text x="560" y="298" font-size="24" fill="#333333" text-anchor="middle">Q1</text>
  <text x="608" y="298" font-size="24" fill="#333333" text-anchor="middle">Q2</text>
  <!-- Unitary Price Elastic -->
  <text x="195" y="350" font-size="24" fill="#333333" text-anchor="middle">Unitary Price Elastic</text>
  <line x1="60" y1="395" x2="60" y2="590" stroke="#333333" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="60" y1="590" x2="330" y2="590" stroke="#333333" stroke-width="2.5" stroke-linecap="square"/>
  <text x="48" y="408" font-size="26" fill="#333333" text-anchor="end">P</text>
  <text x="342" y="599" font-size="26" fill="#333333">Q</text>
