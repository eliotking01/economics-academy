  <text x="325" y="568" font-size="26" font-weight="700" fill="#1d70b8">D</text>
  <!-- Relatively Price Elastic -->
  <text x="595" y="350" font-size="24" fill="#333333" text-anchor="middle">Relatively Price Elastic</text>
  <line x1="460" y1="395" x2="460" y2="590" stroke="#333333" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="460" y1="590" x2="730" y2="590" stroke="#333333" stroke-width="2.5" stroke-linecap="square"/>
  <text x="448" y="408" font-size="26" fill="#333333" text-anchor="end">P</text>
  <text x="742" y="599" font-size="26" fill="#333333">Q</text>
  <line x1="460" y1="470" x2="530" y2="470" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="530" y1="470" x2="530" y2="590" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="460" y1="510" x2="650" y2="510" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="650" y1="510" x2="650" y2="590" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="490" y1="456.67" x2="690" y2="523.33" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <text x="700" y="532" font-size="26" font-weight="700" fill="#1d70b8">D</text>
  <text x="452" y="478" font-size="24" fill="#333333" text-anchor="end">P1</text>
  <text x="452" y="518" font-size="24" fill="#333333" text-anchor="end">P2</text>
  <text x="530" y="618" font-size="24" fill="#333333" text-anchor="middle">Q1</text>
  <text x="650" y="618" font-size="24" fill="#333333" text-anchor="middle">Q2</text>
  <!-- Perfectly Price Elastic -->
  <text x="395" y="670" font-size="24" fill="#333333" text-anchor="middle">Perfectly Price Elastic</text>
  <line x1="260" y1="715" x2="260" y2="910" stroke="#333333" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="260" y1="910" x2="530" y2="910" stroke="#333333" stroke-width="2.5" stroke-linecap="square"/>
  <text x="248" y="728" font-size="26" fill="#333333" text-anchor="end">P</text>
  <text x="542" y="919" font-size="26" fill="#333333">Q</text>
  <line x1="340" y1="810" x2="340" y2="910" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="430" y1="810" x2="430" y2="910" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="260" y1="810" x2="490" y2="810" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <text x="500" y="818" font-size="26" font-weight="700" fill="#1d70b8">D</text>
  <text x="252" y="818" font-size="24" fill="#333333" text-anchor="end">P1</text>
