<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">Comparative advantage shown with two countries' PPFs</title>
  <desc id="d">Two straight-line production possibility frontiers for computer chips and T-shirts on shared axes. Germany's PPF runs from 150mn T-shirts to 20mn computer chips; Vietnam's runs from 200mn T-shirts to 10mn computer chips. Germany has the absolute advantage in computer chips and Vietnam in T-shirts, and each has the lower opportunity cost in that good, so by fully specialising and trading both countries can consume beyond their own PPFs.</desc>
  <!-- geometry
       intersections: 200,268
       on-curve: 100,205 600,520 100,100 350,520
  -->
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="690" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="40" font-size="26" fill="#333333">T-Shirts</text>
  <text x="708" y="584" font-size="26" fill="#333333" text-anchor="end">Computer Chips</text>
  <!-- curves -->
  <line x1="100" y1="205" x2="600" y2="520" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="350" y2="520" stroke="#0f7b6c" stroke-width="3.5" stroke-linecap="round"/>
  <!-- labels -->
  <text x="515" y="430" font-size="26" font-weight="700" fill="#1d70b8">PPF (Germany)</text>
  <text x="160" y="140" font-size="26" font-weight="700" fill="#0f7b6c">PPF (Vietnam)</text>
  <text x="92" y="108" font-size="24" fill="#333333" text-anchor="end">200mn</text>
  <text x="92" y="213" font-size="24" fill="#333333" text-anchor="end">150mn</text>
  <text x="350" y="552" font-size="24" fill="#333333" text-anchor="middle">10mn</text>
  <text x="600" y="552" font-size="24" fill="#333333" text-anchor="middle">20mn</text>
</svg>
