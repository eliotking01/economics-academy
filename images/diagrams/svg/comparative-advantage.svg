<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">Comparative advantage shown with two countries' PPFs</title>
  <desc id="d">Two straight-line production possibility frontiers for computer chips and T-shirts on shared axes. Germany's PPF runs from 200mn T-shirts to 20mn computer chips and lies wholly outside Vietnam's, which runs from 150mn T-shirts to 10mn computer chips. Germany has the absolute advantage in both goods, but a chip costs it 10 T-shirts against Vietnam's 15, so Germany has the comparative advantage in chips and Vietnam in T-shirts.</desc>
  <!-- geometry
       scale: 29px per 1mn chips (x), 2.1px per 1mn T-shirts (y), origin 100,520
       intersections:
       on-curve: 100,100 680,520 100,205 390,520
       the two PPFs do not cross: Germany's lies outside Vietnam's everywhere
  -->
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="690" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="40" font-size="26" fill="#333333">T-Shirts</text>
  <text x="708" y="584" font-size="26" fill="#333333" text-anchor="end">Computer Chips</text>
  <!-- curves -->
  <line x1="100" y1="100" x2="680" y2="520" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="100" y1="205" x2="390" y2="520" stroke="#0f7b6c" stroke-width="3.5" stroke-linecap="round"/>
  <!-- labels -->
  <text x="440" y="300" font-size="26" font-weight="700" fill="#1d70b8">PPF (Germany)</text>
  <text x="372" y="478" font-size="26" font-weight="700" fill="#0f7b6c">PPF (Vietnam)</text>
  <text x="92" y="108" font-size="24" fill="#333333" text-anchor="end">200mn</text>
  <text x="92" y="213" font-size="24" fill="#333333" text-anchor="end">150mn</text>
  <text x="390" y="552" font-size="24" fill="#333333" text-anchor="middle">10mn</text>
  <text x="680" y="552" font-size="24" fill="#333333" text-anchor="middle">20mn</text>
</svg>
