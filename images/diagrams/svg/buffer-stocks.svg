<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">A buffer stock scheme</title>
  <desc id="d">A commodity market diagram with demand and three supply curves inside a price band between Pmax and Pmin. In a normal year S1 sets the price P1 inside the band. A good harvest shifts supply to S2, where the market price P2 would fall below Pmin, so the scheme buys stock, moving supply back towards S1. A bad harvest shifts supply to S3, where P3 would exceed Pmax, so the scheme sells stock, again moving supply back towards S1 and keeping the price inside the band.</desc>
  <!-- geometry
       intersections: 420,360 480,420 360,300
  -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d52349"/>
    </marker>
  </defs>
  <!-- guides -->
  <line x1="360" y1="300" x2="100" y2="300" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="360" y1="300" x2="360" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="420" y1="360" x2="100" y2="360" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="420" y1="360" x2="420" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="480" y1="420" x2="100" y2="420" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="480" y1="420" x2="480" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="690" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="40" font-size="26" fill="#333333">Prices</text>
  <text x="708" y="552" font-size="26" fill="#333333" text-anchor="end">Quantity</text>
  <!-- price band -->
  <line x1="100" y1="330" x2="610" y2="330" stroke="#0f7b6c" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="100" y1="390" x2="610" y2="390" stroke="#0f7b6c" stroke-width="3.5" stroke-linecap="round"/>
  <!-- curves -->
  <line x1="200" y1="140" x2="570" y2="510" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="270" y1="510" x2="620" y2="160" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="150" y1="510" x2="540" y2="120" stroke="#d52349" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="390" y1="510" x2="660" y2="240" stroke="#d52349" stroke-width="3.5" stroke-linecap="round"/>
  <!-- intervention arrows -->
  <line x1="470" y1="200" x2="565" y2="200" stroke="#d52349" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="440" y1="450" x2="345" y2="450" stroke="#d52349" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- labels -->
  <text x="552" y="126" font-size="26" font-weight="700" fill="#d52349">S3</text>
  <text x="632" y="166" font-size="26" font-weight="700" fill="#1d70b8">S1</text>
  <text x="672" y="246" font-size="26" font-weight="700" fill="#d52349">S2</text>
  <text x="582" y="516" font-size="26" font-weight="700" fill="#1d70b8">D</text>
  <text x="618" y="338" font-size="26" font-weight="700" fill="#0f7b6c">Pmax</text>
  <text x="618" y="398" font-size="26" font-weight="700" fill="#0f7b6c">Pmin</text>
  <text x="92" y="308" font-size="24" fill="#333333" text-anchor="end">P3</text>
  <text x="92" y="368" font-size="24" fill="#333333" text-anchor="end">P1</text>
  <text x="92" y="428" font-size="24" fill="#333333" text-anchor="end">P2</text>
  <text x="360" y="552" font-size="24" fill="#333333" text-anchor="middle">Q3</text>
  <text x="420" y="552" font-size="24" fill="#333333" text-anchor="middle">Q1</text>
  <text x="480" y="552" font-size="24" fill="#333333" text-anchor="middle">Q2</text>
</svg>
