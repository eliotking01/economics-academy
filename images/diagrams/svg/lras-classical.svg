<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">Classical long-run aggregate supply curve</title>
  <desc id="d">A vertical LRAS curve at full-employment output Yfe. The price level can sit at PL1 or PL2 without changing potential output, because in the classical view long-run output is independent of the price level.</desc>
  <!-- geometry
       on-curve: 400,200 400,380
  -->
  <!-- guides -->
  <line x1="100" y1="200" x2="400" y2="200" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="100" y1="380" x2="400" y2="380" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="50" font-size="26" fill="#333333">Price</text>
  <text x="32" y="78" font-size="26" fill="#333333">level</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Real GDP</text>
  <!-- curves -->
  <line x1="400" y1="80" x2="400" y2="520" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- labels -->
  <text x="400" y="64" font-size="26" font-weight="700" fill="#1d70b8" text-anchor="middle">LRAS</text>
  <text x="92" y="208" font-size="24" fill="#333333" text-anchor="end">PL2</text>
  <text x="92" y="388" font-size="24" fill="#333333" text-anchor="end">PL1</text>
  <text x="400" y="552" font-size="24" fill="#333333" text-anchor="middle">Yfe</text>
</svg>
