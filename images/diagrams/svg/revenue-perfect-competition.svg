<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">Revenue for a firm in perfect competition</title>
  <desc id="d">A price-taking firm sells every unit at the market price, so demand, average revenue and marginal revenue are one horizontal line at P, and total revenue rises from the origin at a constant rate.</desc>
  <!-- geometry
       on-curve: 360,330 310,310
  -->
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="50" font-size="26" fill="#333333">Revenue</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Quantity</text>
  <!-- curves -->
  <line x1="100" y1="330" x2="620" y2="330" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="100" y1="520" x2="520" y2="100" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- labels -->
  <text x="632" y="338" font-size="26" font-weight="700" fill="#1d70b8">D=AR=MR=P</text>
  <text x="532" y="94" font-size="26" font-weight="700" fill="#1d70b8">TR</text>
  <text x="92" y="338" font-size="24" fill="#333333" text-anchor="end">P</text>
</svg>
