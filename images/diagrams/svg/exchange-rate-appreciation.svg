<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">An appreciation of a floating exchange rate</title>
  <desc id="d">A currency market diagram with the exchange rate on the vertical axis and the quantity of pounds on the horizontal axis. An increase in demand for the currency shifts D1 right to D2 along the fixed supply curve, raising the exchange rate from P1 to P2 — an appreciation — and the quantity traded from Q1 to Q2.</desc>
  <!-- geometry
       intersections: 330,300 395,235
  -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d52349"/>
    </marker>
  </defs>
  <!-- guides -->
  <line x1="330" y1="300" x2="100" y2="300" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="330" y1="300" x2="330" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="395" y1="235" x2="100" y2="235" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="395" y1="235" x2="395" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="690" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="40" font-size="26" fill="#333333">Exchange Rate</text>
  <text x="708" y="552" font-size="26" fill="#333333" text-anchor="end">Quantity (£)</text>
  <!-- curves -->
  <line x1="160" y1="470" x2="560" y2="70" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="160" y1="130" x2="540" y2="510" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="290" y1="130" x2="670" y2="510" stroke="#d52349" stroke-width="3.5" stroke-linecap="round"/>
  <!-- shift arrow -->
  <line x1="240" y1="190" x2="322" y2="190" stroke="#d52349" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- labels -->
  <text x="572" y="76" font-size="26" font-weight="700" fill="#1d70b8">S</text>
  <text x="552" y="505" font-size="26" font-weight="700" fill="#1d70b8">D1</text>
  <text x="682" y="505" font-size="26" font-weight="700" fill="#d52349">D2</text>
  <text x="92" y="243" font-size="24" fill="#333333" text-anchor="end">P2</text>
  <text x="92" y="308" font-size="24" fill="#333333" text-anchor="end">P1</text>
  <text x="330" y="552" font-size="24" fill="#333333" text-anchor="middle">Q1</text>
  <text x="395" y="552" font-size="24" fill="#333333" text-anchor="middle">Q2</text>
</svg>
