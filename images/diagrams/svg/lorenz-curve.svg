<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">The Lorenz curve</title>
  <desc id="d">A Lorenz curve diagram plotting the cumulative percentage of income against the cumulative percentage of households. A 45-degree line of perfect equality runs from the origin to the 100 percent corner; the Lorenz curve bows below it, showing the actual distribution. Area A lies between the line of equality and the Lorenz curve, and area B lies beneath the Lorenz curve; the Gini coefficient is A divided by A plus B.</desc>
  <!-- geometry
       intersections: 130,520 590,60
  -->
  <!-- guides completing the 100% square -->
  <line x1="590" y1="60" x2="130" y2="60" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="590" y1="60" x2="590" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="130" y1="60" x2="130" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="130" y1="520" x2="590" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="100" y="40" font-size="26" fill="#333333">Cumulative % of Income</text>
  <text x="360" y="590" font-size="26" fill="#333333" text-anchor="middle">Cumulative % of Households</text>
  <text x="122" y="552" font-size="24" fill="#333333" text-anchor="middle">0%</text>
  <text x="590" y="552" font-size="24" fill="#333333" text-anchor="middle">100%</text>
  <text x="122" y="68" font-size="24" fill="#333333" text-anchor="end">100%</text>
  <!-- curves -->
  <line x1="130" y1="520" x2="590" y2="60" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 130,520 Q 500,480 590,60" fill="none" stroke="#0f7b6c" stroke-width="3.5" stroke-linecap="round"/>
  <!-- labels -->
  <text x="230" y="140" font-size="26" font-weight="700" fill="#1d70b8">Line of perfect</text>
  <text x="230" y="168" font-size="26" font-weight="700" fill="#1d70b8">equality</text>
  <text x="605" y="300" font-size="26" font-weight="700" fill="#0f7b6c">Lorenz</text>
  <text x="605" y="328" font-size="26" font-weight="700" fill="#0f7b6c">curve</text>
  <text x="375" y="352" font-size="26" font-weight="700" fill="#333333" text-anchor="middle">A</text>
  <text x="480" y="462" font-size="26" font-weight="700" fill="#333333" text-anchor="middle">B</text>
</svg>
