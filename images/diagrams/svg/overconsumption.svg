<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">Negative externality of consumption</title>
  <desc id="d">Marginal social benefit lies below marginal private benefit. The free market consumes at Q1 where D equals MPB crosses S, but the social optimum is at Q2 where MSB crosses S. The shaded triangle between the supply curve and MSB from Q2 to Q1 is the social welfare loss from over-consumption.</desc>
  <!-- geometry
       intersections: 420,240 360,300
       on-curve: 420,360
  -->
  <!-- welfare loss triangle -->
  <path d="M360 300 L420 240 L420 360 Z" fill="#767676" fill-opacity="0.25"/>
  <!-- guides -->
  <line x1="100" y1="240" x2="420" y2="240" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="100" y1="300" x2="360" y2="300" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="420" y1="240" x2="420" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="360" y1="300" x2="360" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="50" font-size="26" fill="#333333">Costs, Benefits</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Quantity</text>
  <!-- curves -->
  <line x1="170" y1="490" x2="590" y2="70" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="240" y1="60" x2="620" y2="440" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="170" y1="110" x2="550" y2="490" stroke="#0f7b6c" stroke-width="3.5" stroke-linecap="round"/>
  <!-- annotation -->
  <text x="520" y="300" font-size="24" fill="#333333">Welfare loss</text>
  <line x1="515" y1="295" x2="428" y2="247" stroke="#333333" stroke-width="1.5"/>
  <!-- labels -->
  <text x="598" y="62" font-size="26" font-weight="700" fill="#1d70b8">S=MPC=MSC</text>
  <text x="628" y="448" font-size="26" font-weight="700" fill="#1d70b8">D=MPB</text>
  <text x="558" y="498" font-size="26" font-weight="700" fill="#0f7b6c">MSB</text>
  <text x="92" y="248" font-size="24" fill="#333333" text-anchor="end">P1</text>
  <text x="92" y="308" font-size="24" fill="#333333" text-anchor="end">P2</text>
  <text x="420" y="552" font-size="24" fill="#333333" text-anchor="middle">Q1</text>
  <text x="360" y="552" font-size="24" fill="#333333" text-anchor="middle">Q2</text>
</svg>
