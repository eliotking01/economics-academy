<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">Production possibility frontier</title>
  <desc id="d">A concave production possibility frontier for capital goods and consumer goods. Points A, C, D and B lie on the frontier and are productively efficient; moving from C to D gains consumer goods at the opportunity cost of capital goods. Point E inside the frontier is inefficient; point F outside it is currently unattainable.</desc>
  <!-- geometry
       on-curve: 100,140 373,205 580,396 620,520
  -->
  <!-- guides -->
  <line x1="100" y1="205" x2="373" y2="205" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="373" y1="205" x2="373" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="100" y1="396" x2="580" y2="396" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="580" y1="396" x2="580" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="50" font-size="26" fill="#333333">Capital goods</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Consumer goods</text>
  <!-- curve -->
  <path d="M100 140 Q560 180 620 520" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- points -->
  <circle cx="100" cy="140" r="7" fill="#333333"/>
  <circle cx="373" cy="205" r="7" fill="#333333"/>
  <circle cx="580" cy="396" r="7" fill="#333333"/>
  <circle cx="620" cy="520" r="7" fill="#333333"/>
  <circle cx="300" cy="340" r="7" fill="#333333"/>
  <circle cx="560" cy="220" r="7" fill="#333333"/>
  <!-- labels -->
  <text x="114" y="134" font-size="24" fill="#333333">A</text>
  <text x="385" y="195" font-size="24" fill="#333333">C</text>
  <text x="594" y="390" font-size="24" fill="#333333">D</text>
  <text x="634" y="512" font-size="24" fill="#333333">B</text>
  <text x="314" y="334" font-size="24" fill="#333333">E</text>
  <text x="574" y="214" font-size="24" fill="#333333">F</text>
  <text x="540" y="290" font-size="26" font-weight="700" fill="#1d70b8">PPF1</text>
</svg>
