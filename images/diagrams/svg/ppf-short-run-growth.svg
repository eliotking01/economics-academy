<svg viewBox="0 0 800 600" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="t">Short-run growth on a production possibility frontier</title>
  <desc id="d">A production possibility frontier with two points inside it. The economy moves from point X to point Y, closer to the frontier, using more of its existing resources. The frontier itself does not shift, so potential output is unchanged.</desc>
  <!-- geometry
       on-curve: 422.5,290
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d52349"/>
    </marker>
  </defs>
  <!-- guides -->
  <line x1="100" y1="400" x2="280" y2="400" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="280" y1="400" x2="280" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="100" y1="300" x2="380" y2="300" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="380" y1="300" x2="380" y2="520" stroke="#767676" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- axes -->
  <line x1="100" y1="60" x2="100" y2="520" stroke="#333333" stroke-width="2.5"/>
  <line x1="100" y1="520" x2="700" y2="520" stroke="#333333" stroke-width="2.5"/>
  <text x="32" y="50" font-size="26" fill="#333333">Capital goods</text>
  <text x="700" y="552" font-size="26" fill="#333333" text-anchor="end">Consumer goods</text>
  <!-- curves -->
  <path d="M100 190 Q510 225 570 520" fill="none" stroke="#1d70b8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- points and movement -->
  <circle cx="280" cy="400" r="6" fill="#333333"/>
  <circle cx="380" cy="300" r="6" fill="#333333"/>
  <line x1="295" y1="385" x2="365" y2="315" stroke="#d52349" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- labels -->
  <text x="578" y="505" font-size="24" font-weight="700" fill="#1d70b8">PPF</text>
  <text x="296" y="414" font-size="24" fill="#333333">X</text>
  <text x="394" y="308" font-size="24" fill="#333333">Y</text>
</svg>
