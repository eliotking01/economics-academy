# GitHub Pages build configuration.
#
# The site is hand-written static HTML. Jekyll renders none of it: no page has
# front matter, so every .html file is copied verbatim. Jekyll is in the loop
# only because GitHub Pages puts it there.
#
# What it *was* doing, left to itself, is publishing this repo's working files
# as web pages. /REVIEW-NOTES.html, /CLAUDE.md, /PROJECT-LOG.html,
# /scripts/build_glossary.py, /raw-notes/... were all live and crawlable. This
# file stops that, for two reasons:
#
#   1. They are internal. docs/REVIEW-NOTES.md in particular is a public list of
#      known content errors on this very site.
#   2. Jekyll runs Liquid over every markdown file BEFORE Markdown, so a stray
#      "{%" anywhere in them fails the whole deploy - not the page, the deploy.
#      That has already happened once. Excluding them removes the class.
#
# Checked before writing this: no served .html, .css, .js, .xml or .webmanifest
# references any excluded path. The only runtime fetches on the site are
# /past-paper-questions/questions.json and /flashcards/data/*.json, both of
# which stay published (see the end of this file).
#
# WARNING: `exclude` REPLACES Jekyll's default list rather than adding to it,
# which is why the defaults are repeated below. Anything deleted from this list
# becomes public again.

exclude:
  # Jekyll's own defaults, restated because setting `exclude` overrides them.
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/

  # Build-time only. Generated output lives elsewhere and is served normally;
  # these are the inputs and the tooling.
  - scripts/
  - boards-data/
  - notes-data/
  - glossary-data/
  - questions-data/
  - past-paper-questions-data/
  - flashcards-data/

  # Internal documentation and working notes.
  - docs/
  # The SEO audit: its own reports, the crawl output, and the Search Console
  # exports. Exactly the category this file exists to keep off the site - the
  # exports list every URL Google has judged, and 00-inventory.md names the
  # site's own defects.
  - seo/
  # Closed out 2026-08-20. Neither is fetched, neither is linked, and neither
  # appears in any Search Console export - so removing the three URLs they
  # served costs nothing measurable.
  #
  #   templates/   the header and footer are the SOURCE the generators read at
  #                build time and must stay in the repo. Nothing fetches them at
  #                page load - that stopped at Wave 4.10 - so there is no reason
  #                to serve them. Ten scripts read them from the filesystem,
  #                which `exclude` does not affect.
  #   LICENSE.txt  the Creative Commons Attribution 3.0 text inherited from the
  #                HTML5 UP "Dopetrope" template. CCA 3.0 asks for a CREDIT, not
  #                for the licence text to be hosted; that credit is in
  #                _archive/README.txt and _archive/README.md.
  - templates/
  - LICENSE.txt

  - CLAUDE.md
  # The nested CLAUDE.md files. Six of the eight sit in directories already
  # excluded above; these two do NOT - revision-notes/ and css/ are published,
  # so without these lines they would be served at /revision-notes/CLAUDE.md
  # and /css/CLAUDE.md. scripts/verify_published_surface.py is the backstop
  # (.md is not in its suffix whitelist) but it verifies AFTER the fact; Pages
  # publishes whatever is on main. Add the line in the same commit as the file.
  - revision-notes/CLAUDE.md
  - css/CLAUDE.md
  - OWNER-TODO.md
  - PROGRESS.md
  - README.md
  - requirements.txt
  # Tooling pins, not site content. package.json records the Prettier version
  # the generators use (scripts/prettier_util.py); nothing on the site reads
  # it, and .json is on verify_published_surface.py's allow-list, so without
  # this line it would be served at /package.json. Added 2026-08-23 with the
  # file. .prettierrc and .prettierignore start with a dot and Jekyll skips
  # them on its own.
  - package.json

  # Already excluded by Jekyll's rule that anything starting with "_" or "."
  # is skipped. Listed so the intent survives if that ever changes.
  - _working/
  - _archive/
  - .github/

# Deliberately NOT excluded, so the change is a decision rather than a habit:
#   past-paper-questions/      questions.json IS still fetched at runtime, by
#                              js/components/question-search.js, on the master
#                              page and on every topic page. Must stay.
#   flashcards/                flashcards/data/*.json is fetched at runtime by
#                              js/components/flashcards.js. Must stay.
#   search-index.json          the site-search payload, generated by
#                              scripts/build_search_index.py and fetched at
#                              runtime by js/components/site-search.js the
#                              first time the search overlay opens. Must stay.
#   webfonts/, images/, marking-examples/, sitemaps/
#
# templates/ and LICENSE.txt WERE in this "deliberately not excluded" block
# until 2026-08-20, when commit 1038b68 added both to the list above and
# closed the question. The "NO LONGER FETCHED ... to close it out, add
# templates/" paragraph that sat here described a state three days out of
# date; it was rewritten on 2026-08-23. The reasoning now lives beside the
# two `exclude` entries themselves, which is the only place it cannot drift
# from the decision.
#
# CORRECTED 2026-08-20. Until then this block claimed templates/ was "fetched at
# runtime by inject-templates.js" - a script deleted at Wave 4.10 - and listed
# two directories that no longer exist, logo/ and old-logos-archive/, one of
# them with nine lines agonising over whether to keep publishing it. The exclude
# list itself was correct throughout; only its explanation had gone stale. This
# is the file that decides what is public, so a wrong comment here is expensive
# - expensive enough that it went stale AGAIN three days later, above.
#
# specificiations/ used to be listed here, as the separate call this file said
# it was. Eliot made that call on 2026-08-08: the two exam-board specification
# PDFs are Pearson and AQA copyright and were deleted from the repo rather than
# excluded, because excluding them would leave the files in the working tree
# and in git history while only hiding them from the site. Nothing linked to
# them - the directory was unreferenced by every .html, .css and .js on the
# site - so removing them cost no internal links. The two URLs now 404, which
# is intended; they had no GSC impressions and appeared in no indexation
# export. Re-run scripts/build_sitemap.py after any such deletion: it enumerates
# from the filesystem, so it drops the URLs by itself.
