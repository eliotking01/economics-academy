# Verification only. This workflow NEVER builds and NEVER deploys.
#
# That is not a style preference, it is the entire basis on which it was
# approved (DECISIONS.md D18, answering Q19). GitHub Pages continues to serve
# from the `main` branch with its own default Jekyll build, and _config.yml's
# `exclude` list remains the only thing deciding what is published. A workflow
# that only reads cannot break the site; the worst case is a red tick.
#
# DO NOT add a build step, a deploy step, or `actions/deploy-pages`. Switching
# Pages to Actions-based deployment disables _config.yml's `exclude`, which is
# the only thing keeping scripts/, _archive/raw-notes/, docs/, seo/ and the root markdown
# off the live site. DO-NOT-BREAK.md says so in as many words.
#
# Every check below was run locally and exits 0 before being added. A workflow
# that is red from its first run gets ignored within a week and then protects
# nothing - which is exactly why verify_liquid.py could not be added until
# PH00-011 was fixed (Wave 1 item 1.2, DECISIONS.md D31).
#
# PH10-062, delivering D18/Q19.

name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The fast suite: ~15 s, no network beyond the checkout, no dependencies
  # past Python 3 and Node.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL history, not a shallow clone, and not fetch-depth: 2.
          #
          # Two reasons. verify_text_integrity and verify_markup_integrity diff
          # against HEAD~1, which needs at least 2. And build_sitemap.py takes
          # every <lastmod> from `git log -1 -- <path>`, which in a shallow clone
          # cannot see the commit that last touched most files - so it computes
          # different dates from the ones committed and reports WOULD CHANGE on
          # 7 files. That is what failed on this workflow's first run.
          #
          # Reproduced locally to be sure rather than guessed: a `--depth 2`
          # clone of this repo reports 7 WOULD CHANGE, a full clone reports 0.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: HTML well-formedness
        run: python3 scripts/verify_html.py
      - name: Internal links and fragments
        run: python3 scripts/verify_links.py
      - name: Glossary is faithful to the notes
        run: python3 scripts/verify_glossary.py
      - name: Past-paper tags
        run: python3 scripts/verify_past_paper_tags.py
      - name: Diagram geometry
        run: python3 scripts/verify_diagram_geometry.py
      # The Font Awesome stylesheet and font are both subsets, and a subset
      # font fails silently - a missing glyph renders as nothing at all. That
      # is how faq.html's 30 accordion icons stayed invisible until a pixel
      # diff found them in Wave 4.2. Stdlib only; it reads the manifest the
      # subsetter writes rather than opening the woff2, which would need
      # brotli.
      - name: Icons are all in the Font Awesome subset
        run: python3 scripts/verify_icons.py
      # Images are max-width: 100%, so the browser uses width/height only for
      # the aspect ratio - it reserves a box of that shape before the bytes
      # arrive. macroeconomics-diagrams.html declared a box 35% too short for
      # one diagram and nothing noticed, because nothing compared the two.
      # Stdlib: it reads the PNG/JPEG/GIF/WEBP/SVG headers itself.
      - name: Image dimensions match the files
        run: python3 scripts/verify_image_dimensions.py
      # contact.css and tutoring.css keep their bare selectors, so what makes
      # those two pages render correctly is that css/main.css is linked first.
      # Wave 4.6 measured what happens otherwise: scoping them reverses 9
      # property conflicts on contact.html and drops the tutoring modal from
      # position: fixed to static. Nothing was checking the order, and a
      # <head> generated by Wave 2's page_shell.py is exactly what would
      # change it - silently, with no error and no failed request.
      - name: Stylesheet load order
        run: python3 scripts/verify_css_load_order.py
      # Wave-norm item (f), D18 Q20 item 6. 322 authored inline style=
      # attributes across 44 files went into CSS classes; this holds the count
      # at 0, because a zero nothing asserts drifts back - and those 322
      # accumulated one hand-written page at a time with nothing watching.
      #
      # It also PINS the 1,187 KaTeX offsets, per page, which is the half that
      # matters more: they are build output positioning every glyph on the two
      # glossary pages and five flashcard decks, DO-NOT-BREAK names them among
      # the four entries hardest to resist undoing, and a sweep for inline
      # styles hits them first. Classification is by construction - inside a
      # class token beginning "katex" - never by page path.
      - name: No authored inline styles, and KaTeX output intact
        run: python3 scripts/verify_inline_styles.py
      # Wave 2 Phase 1. 463 pages carry the same ~2.5 KB of <head>, wrapper and
      # script tail and nothing compared them, which is how 18 pages came to
      # disagree with themselves on a field they write twice and 28 came to
      # load the identical MathJax asset with different markup. This writes
      # today's shape down as literals - the build_past_paper_taxonomy.py
      # EXPECTED pattern - so drift has to change a number in the same commit.
      # A count going DOWN fails too: an improvement is welcome and must be
      # declared. PH06 section 3 Phase 1.
      - name: Page shell has not drifted
        run: python3 scripts/verify_page_shell.py
      # Wave 3.1. boards-data/boards.json is a transcription of the four
      # hardcoded board structures and nothing imports it yet. This is PH09's
      # migration step 1 - add the record, change nothing, prove equivalence -
      # and it is what will say a generator's swap changed no output when the
      # swap is made. The code wins any disagreement: a slug is a live URL and
      # a name is visible text.
      - name: boards.json still matches the generators
        run: python3 scripts/verify_boards.py

      - name: SEO assertions
        run: python3 seo/tools/verify_seo.py

      # Guards the one failure mode that takes down the whole site rather than
      # one page: a stray Liquid tag in published markdown fails the entire
      # Pages build. Safe to run here only since PH00-011 was fixed - it now
      # parses _config.yml's exclude list and checks the 1 markdown file Jekyll
      # actually renders, instead of 124 it does not.
      - name: Liquid syntax in published markdown
        run: python3 scripts/verify_liquid.py

      # Closes the class PH10-060 belongs to: a non-HTML file inside a published
      # directory, invisible to every other tool because they all glob *.html.
      - name: Nothing unexpected on the published surface
        run: python3 scripts/verify_published_surface.py

      # Must report 0. Both extractors strip attributions at extraction, so
      # disagreement here means one of them let something through.
      - name: No source attributions in question text
        run: python3 scripts/strip_source_attributions.py

      # Closes PH01-017: the sitemap drifts because nothing re-runs the builder
      # after a commit. Note this exits non-zero on drift; the "nothing written"
      # line it prints is unconditional and is not a pass signal.
      - name: Sitemap is current
        run: python3 scripts/build_sitemap.py --check

      # Fails while any glossary definition is unclassified. It was held out of
      # this workflow while the two Regulation definitions were open (PH10-063);
      # Eliot ruled on them, so it is green and joins.
      - name: Every glossary definition is classified
        run: python3 scripts/check_glossary_capitalisation.py --check

      - name: Question search component
        run: node scripts/test_question_search.js
      - name: Glossary filter component
        run: node scripts/test_glossary_filter.js

      # Economics prose is never altered by a formatting or structural change.
      # These two are what make that claim checkable rather than asserted.
      - name: Visible text unchanged since the previous commit
        run: python3 scripts/verify_text_integrity.py HEAD~1
      - name: Markup not silently lost since the previous commit
        run: python3 scripts/verify_markup_integrity.py HEAD~1 --strict

  # Separate job: slower (~30 s), and the only one that needs the network, for
  # `npx prettier` and the glossary's KaTeX pre-render. Isolated so a flaky npx
  # cannot mask the fast suite above.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for the same reason: this job runs build_sitemap.py,
          # which derives every <lastmod> from git. It also needs a real clone
          # because verify_generated.py creates a `git worktree`.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Runs every generator inside a throwaway worktree of HEAD and asks git
      # what moved. Answers the question no per-generator --check can: is the
      # committed output still what its source produces? PH09b-026.
      - name: Committed generated output is current
        run: python3 scripts/verify_generated.py

      # The harness's own suite: 39 cases that break each of compare_trees.py's
      # ten assertions on purpose, twelve of which expect a PASS to pin what
      # each assertion is deliberately blind to. ~2m30s, which is why it is in
      # this job rather than the fast one.
      #
      # DO-NOT-BREAK: the suite "is what makes it evidence". It had silently
      # rotted to 31 of 32 - a7-link-lost replaced the page's only
      # /tutoring.html link when it was written, and Phase 7's baked nav gave
      # every page a second one two waves later, so the case had proved nothing
      # since. Nothing noticed until it was run deliberately. THAT is the
      # failure this step exists to catch.
      #
      # compare_trees.py ITSELF is deliberately not a step. Assertion 8 asserts
      # that everything outside --family is byte-identical, so with no --family
      # it fails on any commit that changes any file - measured, including a
      # docs-only one. A check that is always red protects nothing.
      - name: The comparison harness still detects what it claims to
        run: python3 scripts/test_compare_trees.py

# DELIBERATELY ABSENT:
#
#   scripts/compare_trees.py
#     Moved into scripts/ on 2026-08-13 per PH06 section 3, and still not a
#     step. It compares two TREES; assertion 8 is red on every commit without
#     a --family declaration, and assertions 1, 3, 5, 6 and 7 have no
#     declaration mechanism for a deliberate change the way Text-Change: and
#     Markup-Change: do for 2 and 4. Its test suite runs instead, above.
#
#   scripts/convert_raw_notes.py
#     DELETED on 2026-08-13, D44, rather than repaired. It wrote a whole page
#     into a path build_notes_pages.py now generates, from markdown sources
#     measured 0-of-73 in sync with their live pages. PH06-027 asked for its
#     <head> to be fixed; the <head> was never the problem. notes_drift.py
#     section 5 now asserts its absence.
